schema_version: automatic_local_performance.v1
version: v1.8.0
protocol_revision: v1.8.0-codex-0.151-private-ca-header-real-e2e-and-synthetic-benchmark
purpose: normative automatic release evidence for real Codex compatibility, local lifecycle, privacy, and synthetic collector performance
profiles:
  release:
    build: cargo +1.97.0 build --locked -p agent-observability-cli --release
    required_os: macos
    warmup_seconds: 60
    idle_seconds: 900
    synthetic_otlp_requests: 10000
    synthetic_otlp_inter_request_ms: 3
    runs: 5
    sample_interval_seconds: 1
    active_timeout_seconds: 300
  smoke:
    build: cargo +1.97.0 build --locked -p agent-observability-cli
    normative: false
    release_check: false
    synthetic_otlp_requests: 25
    runs: 1
    active_timeout_seconds: 15
workload:
  lifecycle_preflight: bounded built-binary no-argument setup --no-open under isolated HOME and CODEX_HOME, installed Codex 0.151.0 strict config loading, and one actual codex exec against a content-free loopback Responses fixture
  lifecycle_seed: exact private Codex config bytes and permission mode
  lifecycle_assertions: connected config, exact Codex 0.151.0 version and strict config loading, ready or degraded collector, installed KeepAlive LaunchAgent plist, pre-failure synthetic private-CA HTTPS exact-header OTLP and notify durability without raw notify sentinels, unexpected SIGKILL service termination and bounded unaided launchd KeepAlive recovery, post-recovery synthetic private-CA HTTPS exact-header OTLP and notify durability without raw notify sentinels, occupied persisted port explicit reconnect, concurrent explicit connect commands, missing-settings disconnect, exact config restoration, inherited loaded and unloaded plist restoration, and bounded removal of the isolated service
  lifecycle_cleanup: best-effort bounded disconnect, bootout, exact seed restoration, plist removal, and isolated directory removal on success or error
  codex_config_load_boundary: installed @openai/codex 0.151.0 exact version, strict diagnostic loading, and actual codex exec proving exporter construction and native OTLP delivery without an external model request
  observed_compatibility_correction: Codex 0.151.0 on macOS fails exporter construction when client certificate and client private-key identity fields are present; corrected product config uses private-CA HTTPS plus the exact x-agent-observability-token private random request header and no client identity fields
  real_codex_e2e_release_gate: the same exact-revision evidence runs actual Codex 0.151.0 macOS codex exec against a content-free loopback Responses fixture and requires exporter construction, native OTLP acceptance, a private session record, exact 10 input and 2 output token records, and no raw prompt persistence
  synthetic_benchmark_boundary: after the real Codex gate passes, sustained synthetic Codex-shaped OTLP/HTTP JSON /v1/logs requests measure the private-CA HTTPS exact-header collector path and durable report authority
  notify_boundary: separately verified built agent-observability codex-notify supplement through private-CA HTTPS with the exact private random request header
  collector_boundary: built agent-observability collector-serve subprocess
  payload: bounded synthetic Codex-shaped OTLP log pairs with opaque identifiers; one bounded notify supplement per measured run whose raw sentinels must be absent from the durable tree
  readiness: successful private-CA HTTPS and exact-header health probe through the centralized local-collector client within a bounded startup deadline
  collector_shutdown: bounded child termination and wait
metrics:
  synthetic_collector_otlp:
    required_quantiles: [p95, p99]
    validation_scope: every run independently
    p95_ms_max: 20
    p99_ms_max: 50
    command_timeout_seconds: 1
  collector_cpu:
    idle_average_percent_max: 0.5
    active_integrated_percent_max: 100
    normalization: percent of one logical core
  collector_rss:
    peak_mib_max: 96
  disk:
    allocated_tree_bytes_max: 1073741824
  network:
    allowed_transport: private-CA HTTPS with exact private random request header on IPv4 loopback only; not mTLS
    bytes: measured collector process bytes from the existing platform NetworkMonitor and reported without classifying loopback traffic as external
    endpoints: every observed collector endpoint must be IPv4 loopback
    evidence: process NetworkMonitor plus independent socket endpoint scans plus static product surface validation
execution:
  build_timeout_seconds: 600
  startup_timeout_seconds: 10
  cleanup_timeout_seconds: 5
  fail_closed: missing or invalid benchmark metrics, real Codex execution or native OTLP failure, rejected synthetic OTLP requests, Codex version or strict config-load incompatibility, missing notify evidence, durable raw sentinels, non-loopback endpoints, timeout, or threshold breach produce non-zero exit
evidence:
  output: docs/evidence/local/performance/automatic-<run>/manifest.yaml
  exact_source: full git commit, Rust 1.97.0 locked build command, tested binary, package version, profile, and protocol revision
  sanitized_paths: run-relative runtime and protocol paths only; credentials, private key content, port, host path, payload, and raw collector output are forbidden
  release_scope: exact-revision release gate combining actual Codex 0.151.0 macOS end-to-end telemetry compatibility with synthetic collector performance evidence
