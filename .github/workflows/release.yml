name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      evidence-source-revision: ${{ steps.evidence-source.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install release Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Validate tag, source, and versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          cargo_version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "agent-observability-cli") | .version')"
          root_version="$(jq -r .version package.json)"
          package_version="$(jq -r .version distribution/npm/package.json)"
          test "$version" = "$cargo_version"
          test "$version" = "$root_version"
          test "$version" = "$package_version"
      - name: Resolve the exact pre-merge evidence revision
        id: evidence-source
        shell: bash
        run: |
          set -euo pipefail
          revision="$GITHUB_SHA"
          if second_parent="$(git rev-parse "$GITHUB_SHA^2" 2>/dev/null)"; then
            test "$(git rev-parse "$GITHUB_SHA^{tree}")" = "$(git rev-parse "$second_parent^{tree}")"
            revision="$second_parent"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install supported Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target "${{ matrix.target }}"
      - name: Build native CLI
        run: cargo +1.97.0 build --release --locked -p agent-observability-cli --target "${{ matrix.target }}"
      - name: Install exact supported Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/codex-0.151.0"
          npm install --prefix "$prefix" @openai/codex@0.151.0
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Smoke test the exact native release binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(codex --version)" = "codex-cli 0.151.0"
          binary="$PWD/target/${{ matrix.target }}/release/agent-observability"
          test "$("$binary" --version)" = "${GITHUB_REF_NAME#v}"
          cargo +1.97.0 run --locked -p xtask -- perf automatic --profile smoke --check \
            --binary "$binary"
      - name: Verify native CLI
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          binary="target/${{ matrix.target }}/release/agent-observability"
          test "$("$binary" --version)" = "$version"

          mkdir -p "stage/agent-observability-$version-darwin-${{ matrix.label }}/examples" dist
          install -m 0755 "$binary" "stage/agent-observability-$version-darwin-${{ matrix.label }}/agent-observability"
          ln -s agent-observability "stage/agent-observability-$version-darwin-${{ matrix.label }}/agentobs"
          cp README.md LICENSE "stage/agent-observability-$version-darwin-${{ matrix.label }}/"
          cp examples/codex-handoff.v1.jsonl "stage/agent-observability-$version-darwin-${{ matrix.label }}/examples/"
          cp "$binary" "dist/agent-observability-${{ matrix.label }}"
          chmod 0755 "dist/agent-observability-${{ matrix.label }}"
          tar -C stage -czf "dist/agent-observability-$version-darwin-${{ matrix.label }}.tar.gz" \
            "agent-observability-$version-darwin-${{ matrix.label }}"
      - name: Upload native artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  automatic-release-evidence:
    name: Validate exact-revision automatic release evidence
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download and validate exact-revision automatic release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.validate.outputs.evidence-source-revision }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_REVISION"
          artifact="automatic-release-evidence-$SOURCE_REVISION"
          evidence_root="$RUNNER_TEMP/automatic-release-evidence"
          mkdir -p "$evidence_root"
          run_id=""
          while IFS= read -r candidate; do
            candidate_root="$evidence_root/$candidate"
            mkdir -p "$candidate_root"
            if gh run download "$candidate" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "$candidate_root"; then
              run_id="$candidate"
              evidence_root="$candidate_root"
              break
            fi
          done < <(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$SOURCE_REVISION" \
              -f event=workflow_dispatch \
              -f status=success \
              --paginate \
              --jq '.workflow_runs[].id'
          )
          test -n "$run_id"
          mapfile -t manifests < <(find "$evidence_root" -type f -name manifest.yaml -print)
          test "${#manifests[@]}" -eq 1
          manifest="${manifests[0]}"
          grep -Fxq "status: pass" "$manifest"
          grep -Fxq "evidence_kind: automatic_release_evidence" "$manifest"
          grep -Fxq "release_readiness: verified" "$manifest"
          grep -Fxq "real_codex_e2e_status: passed" "$manifest"
          grep -Fxq "source_revision: $SOURCE_REVISION" "$manifest"
          grep -Fxq "profile: release" "$manifest"
          grep -Fxq "protocol_revision: v1.8.0-codex-0.151-private-ca-header-real-e2e-synthetic-benchmark-rss-active-report-v2" "$manifest"
          grep -Fxq "  codex_version: 0.151.0" "$manifest"
          grep -Fxq "  codex_config_load_boundary: installed-codex-0.151.0-strict-config-diagnostic-and-actual-codex-exec-loopback-model-exporter-native-otlp" "$manifest"
          grep -Fxq "  real_codex_e2e_release_gate: passed-actual-codex-0.151.0-macos-codex-exec-content-free-loopback-model-exporter-native-otlp-session-exact-10-input-2-output-tokens-no-raw-prompt-or-response" "$manifest"
          grep -Fxq "  synthetic_benchmark_boundary: post-real-codex-gate-sustained-synthetic-codex-shaped-otlp-http-json-v1-logs-over-private-ca-https-exact-private-random-header-through-centralized-local-collector-client-and-durable-report" "$manifest"

  publish:
    name: Publish release and package
    needs:
      - build
      - automatic-release-evidence
    runs-on: macos-15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: Configure GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@mcprotein"
      - name: Install release tooling
        run: npm ci
      - name: Assemble universal release and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "stage/agent-observability-$version-darwin-universal2/examples" dist npm-stage/bin npm-stage/examples

          chmod 0755 artifacts/agent-observability-arm64 artifacts/agent-observability-x64
          lipo -create \
            artifacts/agent-observability-arm64 \
            artifacts/agent-observability-x64 \
            -output stage/agent-observability
          chmod 0755 stage/agent-observability
          lipo stage/agent-observability -verify_arch arm64 x86_64
          test "$(stage/agent-observability --version)" = "$version"

          install -m 0755 stage/agent-observability \
            "stage/agent-observability-$version-darwin-universal2/agent-observability"
          ln -s agent-observability \
            "stage/agent-observability-$version-darwin-universal2/agentobs"
          cp README.md LICENSE "stage/agent-observability-$version-darwin-universal2/"
          install -m 0755 scripts/install.sh \
            "stage/agent-observability-$version-darwin-universal2/install.sh"
          cp examples/codex-handoff.v1.jsonl \
            "stage/agent-observability-$version-darwin-universal2/examples/"
          tar -C stage -czf "dist/agent-observability-$version-darwin-universal2.tar.gz" \
            "agent-observability-$version-darwin-universal2"
          cp artifacts/*.tar.gz dist/

          cp distribution/npm/package.json distribution/npm/README.md LICENSE npm-stage/
          cp examples/codex-handoff.v1.jsonl npm-stage/examples/
          install -m 0755 stage/agent-observability npm-stage/bin/agent-observability
          npm pack ./npm-stage --pack-destination dist

          install -m 0755 scripts/install.sh dist/install.sh

          tar -xzf dist/mcprotein-agent-observability-"$version".tgz -C stage
          test -x stage/package/bin/agent-observability
          test "$(stage/package/bin/agent-observability --version)" = "$version"
          rm -rf stage/package

          package_prefix="$RUNNER_TEMP/agent-observability-npm-prefix"
          npm install --global --prefix "$package_prefix" \
            "./dist/mcprotein-agent-observability-$version.tgz"
          test "$("$package_prefix/bin/agentobs" --version)" = "$version"
          test "$("$package_prefix/bin/agent-observability" --version)" = "$version"

          (
            cd dist
            shasum -a 256 -- *.tar.gz *.tgz install.sh > SHA256SUMS
          )
      - name: Smoke test release installer
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          fixture="$RUNNER_TEMP/agent-observability-releases/download/$GITHUB_REF_NAME"
          home="$RUNNER_TEMP/agent-observability-installer-home"
          mkdir -p "$fixture" "$home"
          cp "dist/agent-observability-$version-darwin-universal2.tar.gz" \
            dist/SHA256SUMS "$fixture/"

          HOME="$home" \
          SHELL=/bin/zsh \
          AGENT_OBSERVABILITY_VERSION="$version" \
          AGENT_OBSERVABILITY_RELEASE_BASE_URL="file://$RUNNER_TEMP/agent-observability-releases" \
            sh dist/install.sh

          test "$("$home/.local/bin/agent-observability" --version)" = "$version"
          test -L "$home/.local/bin/agentobs"
          test "$("$home/.local/bin/agentobs" --version)" = "$version"
          grep -Fxq '# >>> agent-observability PATH >>>' "$home/.zshrc"
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tgz
            dist/install.sh
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/publish-release.ts draft "$GITHUB_REF_NAME"
      - name: Publish GitHub package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install tsx scripts/publish-release.ts package "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/publish-release.ts finalize "$GITHUB_REF_NAME"
