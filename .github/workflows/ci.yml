name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Check pushed commit
        if: github.event_name == 'push'
        run: git diff-tree --check --root -r HEAD
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --no-fail-fast
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-macos:
    name: Rust macOS
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Run macOS tests
        run: cargo test --workspace --no-fail-fast
      - name: Run automatic performance smoke
        run: cargo run -p xtask -- perf automatic --profile smoke --check
      - name: Run macOS Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  report-ui:
    name: Report UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use minimum supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run report UI checks
        run: npm test
