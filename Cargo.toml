[workspace]
members = [
    "crates/adapter-claude-code",
    "crates/adapter-codex",
    "crates/adapter-cursor",
    "crates/application",
    "crates/cli",
    "crates/contracts",
    "crates/domain",
    "crates/local-runtime",
    "crates/local-store",
    "crates/local-ui",
    "crates/static-report",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "1.7.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
